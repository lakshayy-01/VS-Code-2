<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC</title>
    <style>
        .block{
            background-color: aqua;
            padding: 10px;
            border: 10px solid blue;
            margin: 10px;
            height: 100px;
            width: 100px;
        }
        .inline{
            background-color: bisque;
            padding: 15px;
            margin-bottom: 10px;
            border: 10px solid wheat;
            height: 50px;
            
        }
        .inline_block{
            background-color: chartreuse;
            padding: 10px;
            border: 10px solid green;
            margin: 15px;
        }
    </style>
</head>
<body>
    <div class="block">My Name</div>
    <div class="inline">My Name</div>
    <div class="inline_block">My Name</div>
    
    
</body>
</html>
<!-- block:
 1. next element -> new line
 2. padding : apply in all directions
 3. uheight : works
 4. uwidth : works
  5. margin : works
  6.border : apply in all directions
  inline:
  1. next element -> in same line
  2. padding : apply in all directions
  3. uheight : not works
  4. uwidth : not works
  5. margin : only works horizantally
  6. border : apply in all directions
  inline_block:
  1. next element : in same line
  2. padding : apply in all same direction
  3. uheight :  -->
