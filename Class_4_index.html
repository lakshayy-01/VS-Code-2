<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms and input</title>
</head>
<body>
    <form action="post">
       <div>
        <h2>Enter your First Name</h2>
        <label for="first name">First Name</label>
        <input type="text" name="f_name" id="first name" placeholder="enter ur first name">
    </div>
    <div>
        <h2>Enter your Last Name</h2>
        <label for="last name">Last Name</label>
        <input type="text" id="last name" name="l_name" placeholder="enter your last name">
    </div>
    <div>
        <h2>Enter Your Gender</h2>
        <input type="radio" id="male" name="male_" >
        <label for="male">Male</label>
        <br>
        <input type="radio" id="female" name="male_">
        <label for="female">Female</label>


    </div>

    <div>
        <label for="dob">Enter your DOB</label>
        <input type="date" id="dob" name="dob_" placeholder="enter your age">
    </div>
    <div>
        
        <input type="submit" value=submit>
    </div>

    <div>
        <input type="button" value="reset">
    </div>
<div>

    <input type="reset" value="reset">
</div>


    </form>

    
</body>
</html>
